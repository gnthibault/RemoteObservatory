name: Remote observatory
observatory:
    module: Observatory
    investigator: gnthibault
    latitude: 43.93447527626349  # Degrees
    longitude: 5.710523353974106 # Degrees
    elevation: 650.0 # Meters
    timezone: Europe/Paris #This is not mandatory, just speeds up startup
    # UTC+1 CET Central European Time,
    # UTC +2  CEST Central European Summer Time
    utc_offset: 1 # Hours
    horizon: # Degrees
        0 : 0
        90 : 0
        180 : 0
        270 : 0
    twilight_horizon: -18 # Degrees
    timezone: Europe/Paris
    # Paris is in the Central European Time Zone ( CET ) is 1 hours ahead of
    # Greenwich Mean Time ( GMT+1 ).
    gmt_offset: 60 # Minutes
#    webcam:
#        rtsp_url: rtsp://user:password@192.168.0.16
    scope_controller:
        module: DummyScopeController #IndiArduiScopeController
        port: /dev/ttyACM0
        controller_name: Arduino
        indi_driver_connect_delay_s: 5
        indi_camera_driver_name: Canon DSLR
        indi_mount_driver_name: Losmandy Gemini
        indi_client :
            indi_host : localhost
            indi_port : 7624
            use_unique_client: True
    dome_controller:
        module : IndiDomeController
        dome_movement_timeout_s: 300
        dome_name: Dome Simulator
        indi_client :
            indi_host : localhost
            indi_port : 7624
            use_unique_client: True
directories:
    base: /opt/RemoteObservatory
    images: images
    webcam: webcams
    data: data
    resources: resources/
    targets: resources/targets
    mounts: resources/mounts
db: 
    name: /opt/RemoteObservatory/DB
    type: file
ntp:
    ntpserver: time.google.com
scheduler:
    #module: DefaultScheduler
    module: SpectroScheduler
    #target_file: targets.yaml
    target_file: spectral_targets.yaml
calibration:
    #module: ImagingCalibration
    module: SpectralCalibration
    spectral_calib:
        nb: 2
        sec: 5
        gain: 150
        offset: 30
        temperature: -10
    flat:
        nb: 2
        sec: 5
        gain: 150
        offset: 30
        temperature: -10
    dark:
        dark_nb: 2
    controller:
        module: DummySpectroController
        device_name: dummy
        #module: IndiSpectroController
        #device_name: spox
mount:
    module: Indi10Micron
    mount_name: LX200 10micron
    #module: IndiAbstractMountSimulator
    #mount_name : Telescope Simulator
    equatorial_eod: J2000 # JNOW
    is_simulator: false
    simulator_settings:
        switches:
            MOUNT_TYPE: ['EQ_GEM']
            SIM_PIER_SIDE: ['PS_ON']
    indi_client :
        indi_host : 192.168.8.202
        indi_port : 7624
        use_unique_client: True
cameras:
    -
        module: IndiASICameraNonCool
        camera_name : ZWO CCD ASI290MM Mini
        do_acquisition: false
        SCOPE_INFO: # 200/800 newtonian
            FOCAL_LENGTH: 800
            APERTURE: 200
        subsample_astrometry: 1
        do_guiding: true
        do_pointing: false
        pointing_seconds: 5
        default_exp_time_sec: 5
        default_gain: 300
        default_offset: 10
        do_adjust_pointing: true
        adjust_center_x: 868
        adjust_center_y: 700
        adjust_roi_search_size: 50
        adjust_pointing_seconds: 5
        do_autofocus: true # true
        autofocus_seconds: 5
        autofocus_roi_size :
        autofocus_merit_function: half_flux_radius #vollath_F4
        focuser:
            module: AggregatedCustomScopeControllerUPBv2
            device_name: Pegasus UPB
            device_port: /dev/serial/by-id/usb-Pegasus_Astro_UPBv2_revD_UPB25S4VWV-if00-port0
            connection_type: CONNECTION_SERIAL
            baud_rate: 9600
            polling_ms: 1000
            dustcap_travel_delay_s: 10
            adjustable_voltage_value: 5
            power_labels:
                POWER_LABEL_1: MAIN_TELESCOPE_DUSTCAP_CONTROL
                POWER_LABEL_2: SPOX_AND_DUSTCAP_POWER
                POWER_LABEL_3: MAIN_CAMERA_POWER
                POWER_LABEL_4: MOUNT_POWER
            always_on_power_identifiers:
                MAIN_TELESCOPE_DUSTCAP_CONTROL: True
                SPOX_AND_DUSTCAP_POWER: False
                MAIN_CAMERA_POWER: False
                MOUNT_POWER: False
            usb_labels:
                USB_LABEL_1: FIELD_CAMERA
                USB_LABEL_2: PRIMARY_CAMERA
                USB_LABEL_3: SPECTRO_CONTROL_BOX
                USB_LABEL_4: ARDUINO_CONTROL_BOX
                USB_LABEL_5: WIFI_ROUTER
                USB_LABEL_6: GUIDE_CAMERA
            always_on_usb_identifiers:
                FIELD_CAMERA: False
                PRIMARY_CAMERA: False
                SPECTRO_CONTROL_BOX: False
                ARDUINO_CONTROL_BOX: False
                WIFI_ROUTER: True
                GUIDE_CAMERA: False
            dew_labels:
                DEW_LABEL_1: PRIMARY_FAN
                DEW_LABEL_2: SECONDARY_DEW_HEATER
                DEW_LABEL_3: FINDER_DEW_HEATER
            auto_dew_identifiers:
                PRIMARY_FAN: False
                SECONDARY_DEW_HEATER: True
                FINDER_DEW_HEATER: True
            auto_dew_aggressivity: 150 # Number between 50 and 250
            focus_range:
                min: 16000,
                max: 17000
            autofocus_step:
                coarse: 100
                fine: 50
            autofocus_range:
                coarse: 1000
                fine: 500
            indi_client:
                indi_host: 192.168.8.202
                indi_port: 7624
        indi_client:
            indi_host: 192.168.8.202
            indi_port: 7624
    -
        module: IndiPlayerOneCamera
        camera_name : PlayerOne CCD Ares-M PRO
        do_acquisition: true
        working_temperature: -10
        SCOPE_INFO: # 200/800 newtonian
            FOCAL_LENGTH: 800
            APERTURE: 200
        subsample_astrometry: 2
        do_guiding: false
        do_pointing: false
        pointing_seconds: 5
        default_exp_time_sec: 5
        default_gain: 125
        default_offset: 5
        indi_client :
            indi_host: 192.168.8.202
            indi_port : 7624
            use_unique_client: True
    - module: IndiASICamera
      camera_name: ZWO CCD ASI533MM Pro
      do_acquisition: false
      working_temperature: 10
      SCOPE_INFO: # 200/800 newtonian
          FOCAL_LENGTH: 800
          APERTURE: 200
      subsample_astrometry: 2
      do_guiding: false
      do_pointing: true
      pointing_seconds: 5
      default_exp_time_sec: 5
      default_gain: 50
      default_offset: 30
      do_autofocus: false
      indi_client:
          indi_host: 192.168.8.202
          indi_port: 7624
pointer:
    module: DifferentialPointer #DifferentialPointer #IterativeSync
    gen_hips: False
    timeout_seconds: 450
    max_iterations: 5
    max_pointing_error_seconds: 2
offset_pointer:
    module: InvisibleObjectOffsetPointer #StarOffsetPointer #NoOffsetPointer #InvisibleObjectOffsetPointer
    timeout_seconds: 300
    max_identification_error_seconds: 1
    sync_mount_upon_solve: False
    use_guider_adjust: False # Only valid for StarOffset: use PhD2 to put star in slit
    on_star_identification_failure: trust_astrometry # get_brightest or trust_astrometry
    max_iterations: 5
    max_pointing_error_seconds: 2
guider:
    module : GuiderPHD2
    host : localhost
    port : 4400
    do_calibration : True
    profile_name : spectro_br
    exposure_time_sec : 2
    settle :
        pixels : 3
        time : 10
        timeout : 360
    dither :
        pixels : 0.0
        ra_only : False
weather_service :
    #module : IndiOpenWeatherMap
    #service_name: OpenWeatherMap
    module : IndiWeather
    service_name : Weather Simulator
    key_path : /opt/RemoteObservatory/keys.json
    delay_sec : 60
    observatory:
        latitude: 43.56 # Degrees
        longitude: 5.43 # Degrees
        elevation: 150.0 # Meters
    limits :
        MAX_WEATHER_WIND_SPEED_KPH : 25
        MAX_WEATHER_WIND_GUST_KPH : 30
        MAX_WEATHER_CLOUD_COVER : 5
    indi_client :
        indi_host : localhost
        indi_port : 7624
        use_unique_client: True
#vizualization_service:
#        module: SceneVizualization
#        delay_sky_update_s: 1
#        delay_moving_objects_s: 0.05
#        show_stars: False
#        gps_coord:
#            latitude: 45.67
#            longitude: 5.67
time_service :
    module : HostTimeService
messaging_publisher:
    module: PanMessagingMQTT #PanMessagingZMQ, PanMessagingMQTT
    mqtt_host: localhost
    mqtt_port: 1883
    com_mode: publisher
    msg_port: 6510
messaging_subscriber:
    module: PanMessagingMQTT #PanMessagingZMQ, PanMessagingMQTT
    mqtt_host: localhost
    mqtt_port: 1883
    com_mode: subscriber
    cmd_port: 6500
paws_subscriber:
    module: PanMessagingMQTT #PanMessagingZMQ, PanMessagingMQTT
    mqtt_host: localhost
    mqtt_port: 1883
    com_mode: subscriber
    cmd_port: 6511
paws_publisher:
    module: PanMessagingMQTT #PanMessagingZMQ, PanMessagingMQTT
    mqtt_host: localhost
    mqtt_port: 1883
    com_mode: publisher
    msg_port: 6500

